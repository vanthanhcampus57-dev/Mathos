# Nginx Configuration for Mathos Production Infrastructure
# VPS IP: 14.225.46.204
# Preserves existing personal websites on tuananhtinhoc.info.vn

# 1. API Domain: api.mathos.vn -> FastAPI Backend (Docker port 8080)
server {
    listen 80;
    listen [::]:80;
    server_name api.mathos.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mathos.vn;

    ssl_certificate /etc/letsencrypt/live/api.mathos.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mathos.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Download Domain: download.mathos.vn -> Static File Delivery
server {
    listen 80;
    listen [::]:80;
    server_name download.mathos.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name download.mathos.vn;

    ssl_certificate /etc/letsencrypt/live/download.mathos.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.mathos.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mathos-downloads;
    
    location /releases/ {
        alias /var/www/mathos-downloads/releases/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Access-Control-Allow-Origin "*";
    }
}

# 3. Main Website Domain: mathos.vn -> Next.js Website (Node.js port 3000)
