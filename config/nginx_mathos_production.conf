# Nginx virtual hosts for Mathos production on VPS 14.225.46.204.
# The existing tuananhtinhoc.info.vn virtual host remains unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name mathos.vn www.mathos.vn api.mathos.vn download.mathos.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mathos.vn www.mathos.vn;

    ssl_certificate /etc/letsencrypt/live/mathos.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathos.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mathos.vn;

    ssl_certificate /etc/letsencrypt/live/mathos.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathos.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name download.mathos.vn;

    ssl_certificate /etc/letsencrypt/live/mathos.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathos.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /releases/ {
        alias /opt/mathos/downloads/releases/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        return 302 https://mathos.vn/tai-game;
    }
}
